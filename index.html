<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d19" />
    <meta name="description" content="Portfólio de Gabrieli." />
    <title>Gabrieli | Portfólio</title>
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        if (theme === 'light') document.querySelector('meta[name="theme-color"]').content = '#f3f6fb'
      } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
